# The plugin repo's own CI: the engine and plugin test suites, and the human
# index clicked in a browser, on every PR. Determinism is the contract (same
# source bytes in ⇒ byte-identical artifacts out), and the golden diffs that
# prove it only mean something if they run on every change. No LLM, no
# secrets, a read-only token, actions pinned by commit as release.yml pins
# them. No network beyond checkout and Node, save the browser-smoke job's.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # bash on both runners: Node 20's --test takes file paths, not glob
      # patterns (22 accepts either), so the shell expands the glob.
      - name: Engine tests (determinism, goldens, extractors, viewers)
        working-directory: packages/zdd-engine
        shell: bash
        run: node --test test/*.test.mjs
      - name: Plugin tests (runbook, hooks, skew, manifests)
        shell: bash
        run: node --test plugins/zdd/test/*.test.mjs

  # The human index clicked in headless Chromium (decision 0044): the engine
  # job proves the page's data and structure, this one its behaviour. Its
  # Playwright lives in test/browser, outside the published package, so the
  # engine stays dependency-free. Its network beyond the jobs above: npm,
  # Playwright's Chromium download, Ubuntu's package mirrors for Chromium's
  # system libraries, and GitHub's cache and artifact services; the page
  # itself may make no request, and the test refuses any. Ubuntu, Node 22
  # only: what is under test runs in the browser, not in Node.
  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      - run: npm ci
      - name: Cache Playwright's Chromium
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/browser/package-lock.json') }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Human index smoke test (peeks, back history, blessing → node, hostile and empty stores)
        run: node --test *.test.mjs
      - name: Screenshots of failing flows
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-screenshots
          path: test/browser/artifacts/
          if-no-files-found: ignore
