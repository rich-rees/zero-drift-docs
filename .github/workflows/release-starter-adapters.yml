# The starter library's release (decision 0048, As built slice 4): a version
# line of its own, beside the engine's.
#
# Push a tag `starter-adapters-vX.Y.Z` on main and this job stages that version of
# @rich-rees/zdd-starter-adapters (packages/zdd-starter-adapters/scripts/stage.mjs: the
# baseline 0.1.0 is the tree with baseline/ laid over it, any other version
# the tree as its package.json says), proves the engine and library suites
# on the tagged commit, publishes the staged folder to npm, and creates a
# GitHub release, never marked Latest (the engine's release is the latest).
#
# No secret anywhere: npm trusts this workflow directly (trusted publishing,
# OpenID Connect) — on npmjs.com @rich-rees/zdd-starter-adapters names GitHub
# Actions, rich-rees/zero-drift-docs and release-starter-adapters.yml as its
# publisher. The package's first publish and that publisher are set up by
# hand before the first tag: a new package's first publish is staged by npm
# and its pending publisher expires unless something publishes.
#
# A tag publishes only from main: the tagged commit must be reachable from
# main. A rerun after a publish that succeeded resumes: a version already on
# npm whose gitHead is this commit is taken as published.

name: release-starter-adapters

on:
  push:
    tags:
      - "starter-adapters-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main — a release is tagged on a commit of main; delete the tag and tag main"; exit 1
          fi

      # Staged inside the checkout, so npm records this commit as the
      # version's gitHead and a rerun can tell its own publish (git-ignored).
      - name: Stage the version the tag names
        id: stage
        run: |
          V="${GITHUB_REF_NAME#starter-adapters-v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          node packages/zdd-starter-adapters/scripts/stage.mjs "${V}" "${GITHUB_WORKSPACE}/.starter-adapters-stage"

      - name: Engine tests
        run: cd packages/zdd-engine && node --test "test/*.test.mjs"

      - name: Starter library tests
        run: cd packages/zdd-starter-adapters && node --test "test/*.test.mjs"

      - name: The staged version's own tests, as an app runs them
        run: node packages/zdd-engine/bin/zdd-engine.mjs test --adapters="${GITHUB_WORKSPACE}/.starter-adapters-stage/adapters"

      - name: Not already on npm — unless by this very commit (a rerun resumes)
        id: npm
        run: |
          V="${{ steps.stage.outputs.version }}"
          if npm view "@rich-rees/zdd-starter-adapters@${V}" version >/dev/null 2>&1; then
            HEAD="$(npm view "@rich-rees/zdd-starter-adapters@${V}" gitHead 2>/dev/null || true)"
            if [ "${HEAD}" = "${GITHUB_SHA}" ]; then
              echo "@rich-rees/zdd-starter-adapters@${V} is already published from this commit — resuming after the publish"
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "@rich-rees/zdd-starter-adapters@${V} is already published from ${HEAD:-an unknown commit} — a version is immutable; bump the version instead"; exit 1
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Publish the staged library (trusted publishing, no token)"
        if: steps.npm.outputs.published == 'false'
        run: |
          npm install -g npm@latest   # trusted publishing needs npm 11.5+
          cd "${GITHUB_WORKSPACE}/.starter-adapters-stage" && npm publish --access public --provenance

      - name: Published and fetchable from outside the repo
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          NODE_AUTH_TOKEN: ""
        run: |
          V="${{ steps.stage.outputs.version }}"
          cd "$(mktemp -d)"
          for i in $(seq 1 20); do
            if [ "$(npm view "@rich-rees/zdd-starter-adapters@${V}" version 2>/dev/null)" = "${V}" ]; then exit 0; fi
            sleep 30
          done
          echo "@rich-rees/zdd-starter-adapters@${V} did not become fetchable in ten minutes"; exit 1

      - name: GitHub release, notes from notes.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.stage.outputs.version }}"
          node -e 'const n = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).versions.find((v) => v.version === process.argv[2]); const lines = [n.summary, ""]; for (const [s, x] of Object.entries(n.starters)) for (const f of x.fixes) lines.push(`- **${s}**: ${f.what}`); lines.push("", "Package: `@rich-rees/zdd-starter-adapters@" + process.argv[2] + "`"); process.stdout.write(lines.join("\n") + "\n");' "${GITHUB_WORKSPACE}/.starter-adapters-stage/notes.json" "${V}" > "${RUNNER_TEMP}/notes.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists — left as it is"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" --latest=false
          fi
