# Zero-Drift Docs — blocking CI check.
# Managed by Zero-Drift Docs (zdd): written by `zdd:bootstrap`; `zdd:bootstrap
# --upgrade` rewrites the engine pin below. Remove this header line to take
# ownership of the file.
#
# Copy into the adopter repo's .github/workflows/ and require it in branch
# protection (plus "require branches up to date before merge"). This is what
# turns zero-drift from a habit into a gate: it re-runs the deriver and renderer
# in --check mode and fails if the committed artifacts don't match source.
#
# No LLM in CI, by design — this job is deterministic and secret-free. It calls
# the same @rich-rees/zdd-engine the plugin's skills call, so CI and the agent
# can never disagree about what "fresh" means.
#
# The engine version is PINNED (one place, below): an unpinned npx would pick up
# a newer engine that expects a generated file your branch does not have yet
# (0.4 added zdd/graph.json) and fail every PR until you regenerate. Bump the
# pin deliberately, run `render` and commit the result in the same PR.

name: zdd

on:
  pull_request:
  workflow_dispatch:

env:
  ZDD_ENGINE: "@rich-rees/zdd-engine@1.0.0"

jobs:
  zero-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the renderer's changed-set highlight and the freshness
          # diff both need origin/<baseBranch> and the store files' history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Codebase metadata matches source
        run: npx -y "$ZDD_ENGINE" derive --check

      - name: Indexes match their inputs
        run: npx -y "$ZDD_ENGINE" render --check

      - name: Store lints (supersession symmetry, etc.)
        run: npx -y "$ZDD_ENGINE" lint

      - name: Semantic-map freshness (advisory)
        run: npx -y "$ZDD_ENGINE" freshness >> "$GITHUB_STEP_SUMMARY"
